<!-- todo/templates/todo/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
</head>
<body>
    <h1>To-Do List</h1>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Enter new task" required>
        <button type="submit">Add Task</button>
    </form>
    <ul>
        {% for task in tasks %}
            <li>
                {% if task.completed %}
                    <strike>{{ task.title }}</strike>
                {% else %}
                    {{ task.title }}
                {% endif %}
                <a href="{% url 'toggle_task' task.id %}">[Toggle]</a>
                <a href="{% url 'delete_task' task.id %}">[Delete]</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
